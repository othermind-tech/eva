version: 2
# Python dependencies are hash-locked (backend/requirements.lock) and bumped by hand, so pip is not listed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Vite 8 goes together with @vitejs/plugin-react 6, and @eslint/js 10 needs ESLint 10; take these major updates together, by hand.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /build
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Major updates to the packaging tools change the installer build; take them by hand with a full install test.
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@electron/fuses"
        update-types: ["version-update:semver-major"]
      - dependency-name: "javascript-obfuscator"
        update-types: ["version-update:semver-major"]
