name: Release

# Push a tag such as v0.1.0 to build the installer and publish a GitHub Release.
# "Run workflow" (workflow_dispatch) does a dry run: it builds and uploads the installer as a workflow artifact
# but publishes nothing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write       # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.7.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dryrun"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into build/package.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('build/package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('build/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Build the installer
        shell: powershell
        run: .\build\scripts\build-all.ps1

      - name: Checksums
        shell: bash
        run: |
          cd installer
          sha256sum EVA-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/EVA-Setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            installer/EVA-Setup.exe
            installer/EVA-Setup.exe.blockmap
            installer/latest.yml
            installer/SHA256SUMS.txt

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - name: Extract release notes from docs/CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## v" v "([^0-9A-Za-z.-]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' docs/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "docs/CHANGELOG.md has no '## v$VERSION' section"; exit 1; fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag $flags --title "EVA $VERSION" --notes-file notes.md \
            installer/EVA-Setup.exe installer/EVA-Setup.exe.blockmap installer/latest.yml installer/SHA256SUMS.txt
