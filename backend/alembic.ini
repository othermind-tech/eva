# alembic.ini — EVA backend Alembic configuration

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration filenames.  Produces readable names like:
#   20260410_1200_0001_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Max length of the slug part in the filename
truncate_slug_length = 40

# The database URL is overridden in env.py from core.db.session / config/settings.
# Leave as placeholder — do NOT put a real URL here (it would be ignored anyway).
sqlalchemy.url = sqlite+aiosqlite:///./eva.db

# Output encoding for migration files
output_encoding = utf-8


# ── Logging configuration ─────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
