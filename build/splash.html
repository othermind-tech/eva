<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 440px;
      height: 320px;
      background: #06090F;
      border: 1px solid rgba(0, 201, 255, 0.2);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,201,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #00C9FF 0%, #7C6CF3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      z-index: 1;
    }

    .tagline {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 40px;
      z-index: 1;
    }

    .status-text {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 12px;
      z-index: 1;
      min-height: 18px;
      transition: opacity 0.3s;
    }

    .progress-track {
      width: 260px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      z-index: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00C9FF, #7C6CF3);
      border-radius: 99px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(0,201,255,0.5);
    }

    .version {
      position: absolute;
      bottom: 18px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo">EVA</div>
  <div class="tagline">AI Assistant</div>
  <div class="status-text" id="status">Initializing...</div>
  <div class="progress-track">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="version" id="ver"></div>

  <script>
    window.splashBridge.onStatusUpdate(({ message, percent }) => {
      document.getElementById('status').textContent = message
      document.getElementById('bar').style.width = percent + '%'
    })
  </script>
</body>
</html>
